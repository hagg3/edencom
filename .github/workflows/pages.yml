# Deployed by edencom (public); the private repo keeps the source here and publish-to-edencom.sh copies it to
# .github/workflows/pages.yml. Builds site/ with the stdlib generator and publishes it to GitHub Pages.
# One-time setup on edencom: Settings > Pages > Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'changelog.md', 'VERSION.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check and build
        run: |
          python3 -I site/build.py --check
          python3 -I site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_out
      - id: deployment
        uses: actions/deploy-pages@v4
