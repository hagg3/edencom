# .github/workflows/native.yml — Phase N Stage 3.1.
#
# WHY THIS FILE IS THE VERIFICATION AND NOT A CONVENIENCE: there is no Linux box and no Windows box
# and no container runtime on the development Mac, so these runners are the ONLY place the two new
# platforms are ever built or run. Stage 3's success criteria are written headless-only for exactly
# that reason — a CI runner has no GL context, so every windowed, visual or gamepad check on
# Windows and Linux is owed to a human and is NOT claimed here.
#
# Until 2026-10-13 a `web` job also built the Emscripten target and ran its headless suites; the
# web build was retired that day (tag web-port-final) and the job with it.
#
# THE JOB ORDER IS THE SAVE-INTERCHANGE TEST, not scheduling. `linux` runs first and publishes a
# world it wrote; `windows`, `macos` and `ios` each LOAD that file and must report the same
# geometry checksum. That is a stronger statement than comparing bytes — it says the other
# platform can read it, which is the thing that matters to a player who moves a save between
# machines — and `interchange` then does the byte comparison on top, in one place.
name: native

on:
  push:
    branches: ["**"]
    paths:
      - "Classes/**"
      - "Lighting.cpp"
      - "cmake/**"
      - "native/**"
      - "port/**"
      - ".github/workflows/native.yml"
      - ".github/scripts/**"
  pull_request:
  workflow_dispatch:
    inputs:
      # Set by ./publish-to-edencom.sh --release. The release job at the bottom needs every
      # build job green, then attaches the chosen platforms' artifacts to release v<version>.
      release:
        description: "Publish a GitHub release after the build"
        type: boolean
        default: false
      release_version:
        description: "Release version (default: VERSION.txt)"
        type: string
        default: ""
      release_platforms:
        description: "Comma list of: linux, macos, windows, ios"
        type: string
        default: "linux,macos,windows,ios"

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, and the SAME on all three platforms — including macOS, where Homebrew happens to ship
  # exactly this. Stage 3's design is "change one variable per leg"; a version that drifts between
  # runners would put SDL back into the set of variables.
  SDL_VERSION: "3.4.12"
  # CI runners have neither a display nor a sound card. SDL's dummy backends make that explicit
  # rather than letting each selftest discover it as a device-open failure; the decoders, the
  # mixer bookkeeping and the event pump all still run for real.
  SDL_VIDEO_DRIVER: dummy
  SDL_AUDIO_DRIVER: dummy
  # The figures Stage 1's criteria are stated in come out of the eden_debug_* probes, which are
  # OFF in Release unless asked for — Release codegen with the probes still compiled in.
  EDEN_CMAKE_FLAGS: "-DCMAKE_BUILD_TYPE=Release -DEDEN_DIAGNOSTICS=ON"

jobs:
  # =============================================================================================
  # Linux — the ELF control. First leg, deliberately: it changes one variable against the macOS
  # build (the libc and ELF) before Windows changes three (object format, CRT, `long` width).
  # (Until G.3 it was also the leg that ran the port's own GNU-ABI ObjC runtime and Foundation shim.)
  # =============================================================================================
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld ninja-build cmake gdb zlib1g-dev libcurl4-openssl-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-prefix
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-latest

      - name: Build SDL3 from source
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          # Ubuntu 24.04 has no libsdl3-dev (SDL3 arrived in 25.04), and a distro package would in
          # any case pin a different version per runner image. Source-building the pinned tag is
          # what keeps SDL out of the variable set.
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-prefix" \
            -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL/build --parallel
          cmake --install /tmp/SDL/build

      # QA.16 (A5-10): a compiler cache; the build is ~3 min of the job, and a sanitizer build is
      # a different set of objects, so each job has its own key.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}

      - name: Configure
        working-directory: native
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -G Ninja $EDEN_CMAKE_FLAGS -DEDEN_WERROR_INIT=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_PREFIX_PATH="$HOME/sdl3-prefix"

      - name: Build
        working-directory: native
        run: cmake --build build --parallel

      - name: Gates — the table (.github/scripts/gates.sh) — boot, geometry, selftests, save round-trip
        working-directory: native
        env:
          GATE_JOBS: 3
        # ONE list for every job: .github/scripts/gates.sh (QA.16). It runs each gate through
        # .github/scripts/run-gate.sh (no `| tee`, a backtrace on a crash) and lists what failed at the end.
        run: |
          set -e
          . ../.github/scripts/run-gate.sh
          export LD_LIBRARY_PATH=$HOME/sdl3-prefix/lib
          B=./build/eden_native
          bash ../.github/scripts/gates.sh linux

          # THE WORLD FILE IS NOT NAMED AFTER THE WORLD. This engine gives every world a random
          # 40-character filename and keeps the display name inside the header: find it, don't assume.
          # (The "save round-trip" gate's --docs is gate-docs/save-round-trip.)
          mkdir -p publish
          cp "$(ls -S gate-docs/save-round-trip/Worlds/*/*.emod | head -1)" publish/world-linux.emod
          # S.8: the byte comparison runs on the `.eden` EXPORT of each platform's world -- the logical,
          # deterministic form (an `.emod` carries record headers/CRCs that are not comparable).
          ./build/eden_native --export=publish/world-linux.emod --export-out=publish/world-linux.eden

          # ...and PUBLISH THE CHECKSUM OF LOADING IT, which turns the other platforms' "read the world
          # Linux wrote" gates into assertions. `--world=ci` is load-bearing: --stage1 creates-or-loads BY
          # DISPLAY NAME, and the world in that docs dir is called "ci"; without it the run creates a new
          # "stage1" world beside it and checksums that instead.
          run_gate "crossload self" $B --headless --stage1 --world=ci --docs="$PWD/gate-docs/save-round-trip"
          sed -n 's/.*"geom":"\([0-9a-f]*\)".*/\1/p' gate-crossload-self.log | head -1 \
            > publish/world-linux.geom
          test -s publish/world-linux.geom
          echo "linux loads its own world as geom $(cat publish/world-linux.geom)"
          ls -l publish

      # ROADMAP 5.9: the world browser's REAL HTTP backend (NSURLSession / libcurl / WinHTTP —
      # --browser-selftest above uses offline fixtures and never touches it). Lists from the archive
      # and both Eden servers, a preview, and the smallest archive world downloaded and loaded.
      # NOT A GATE: it depends on hagg3.github.io and edengame.net being up, which a red CI run
      # must never be about. Read its log when a backend changes.
      - name: Live network smoke — archive + both Eden servers (informational)
        working-directory: native
        continue-on-error: true
        run: ./build/eden_native --net-live-selftest --docs="$PWD/live-docs"

      - uses: actions/upload-artifact@v4
        with:
          name: world-linux
          retention-days: 1
          # Both files: the world, and the geometry checksum Linux gets from loading it. The other
          # three jobs assert against that number.
          path: native/publish/world-linux.*
          if-no-files-found: error

      # -----------------------------------------------------------------------------------------
      # The downloadable: a tar.gz of a flat directory (binary + assets + the pinned libSDL3),
      # same layout as the Windows zip. It is tarred HERE because an artifact zip drops unix mode
      # bits. System libraries (GL, X11/Wayland, curl, ALSA/Pulse) come from the player's distro.
      # -----------------------------------------------------------------------------------------
      - name: Package a portable tar.gz
        working-directory: native
        run: |
          set -e
          rm -rf dist && mkdir -p dist/Emod
          cp build/eden_native dist/Emod/emod-bin
          find build -maxdepth 1 \( -type f -o -type l \) \
            \( -name '*.png' -o -name '*.edm' -o -name '*.caf' -o -name '*.wav' \
               -o -name '*.aif' -o -name '*.mp3' -o -name '*.eden' -o -name '*.emod' -o -name '*.ttf' \) -exec cp -L {} dist/Emod/ \;
          cp -RL build/packs dist/Emod/   # K.2-3: content packs keep their tree; no stock pack = no game
          cp -a "$HOME"/sdl3-prefix/lib/libSDL3.so* dist/Emod/
          printf '%s\n' '#!/bin/sh' \
            'd="$(dirname "$(readlink -f "$0")")"' \
            'LD_LIBRARY_PATH="$d${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$d/emod-bin" "$@"' > dist/Emod/emod
          chmod +x dist/Emod/emod dist/Emod/emod-bin
          test -f dist/Emod/Eden.emod || { echo "::error::Eden.emod is not in the package"; exit 1; }
          n=$(find dist/Emod -type f | wc -l)
          [ "$n" -gt 800 ] || { echo "::error::only $n files in the package"; exit 1; }
          cp ../LICENSE ../COPYING ../NOTICE dist/Emod/   # zstd (BSD-3) requires its notice in binary distributions
          tar -C dist -czf Emod-linux-x64.tar.gz Emod
          for f in COPYING LICENSE NOTICE; do tar -tzf Emod-linux-x64.tar.gz | grep -qx "Emod/$f" || { echo "::error::$f is not inside Emod-linux-x64.tar.gz"; exit 1; }; done
          ls -l Emod-linux-x64.tar.gz

      - name: Smoke-test the package from another directory
        run: |
          set -e
          rm -rf /tmp/unpack && mkdir /tmp/unpack && tar -C /tmp/unpack -xzf native/Emod-linux-x64.tar.gz
          # no LD_LIBRARY_PATH of ours: the launcher must supply libSDL3 itself
          (cd / && env -u LD_LIBRARY_PATH /tmp/unpack/Emod/emod --p1-gate)

      - uses: actions/upload-artifact@v4
        with:
          name: eden-linux-x64-portable
          retention-days: 7
          path: native/Emod-linux-x64.tar.gz
          if-no-files-found: error

  # =============================================================================================
  # Sanitizers (G.2s) — the Linux build again with -fsanitize=address,undefined (EDEN_SANITIZE),
  # (until G.3 that covered the hand-written ObjC runtime and the shim Foundation too). Ahead of G.2b's string/ownership moves, where use-after-free and overflow
  # appear. Any report aborts the run (UBSan is -fno-sanitize-recover), so it fails the gate.
  # Leak detection is OFF: --leak-probe in the linux job owns leaks, and LSan would report every
  # process-lifetime singleton at exit. --leak-probe is not run here: ASan's quarantine keeps
  # freed blocks live, so its flat-heap fit fails by construction.
  # =============================================================================================
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld ninja-build cmake gdb zlib1g-dev libcurl4-openssl-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-prefix
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-latest

      - name: Build SDL3 from source
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-prefix" \
            -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL/build --parallel
          cmake --install /tmp/SDL/build

      # QA.16 (A5-10): a compiler cache; the build is ~3 min of the job, and a sanitizer build is
      # a different set of objects, so each job has its own key.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}

      - name: Configure and build (ASan + UBSan)
        working-directory: native
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja $EDEN_CMAKE_FLAGS -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DEDEN_SANITIZE=ON -DCMAKE_PREFIX_PATH="$HOME/sdl3-prefix"
          cmake --build build --parallel

      - name: Python venv for the hostile-world gate (emod.py needs zstandard)
        working-directory: native
        run: python3 -m venv hostile-venv && hostile-venv/bin/pip install -q zstandard==0.25.0

      - name: Gates under ASan + UBSan (the table, gates.sh)
        working-directory: native
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -e
          export LD_LIBRARY_PATH=$HOME/sdl3-prefix/lib
          bash ../.github/scripts/gates.sh sanitize

  # =============================================================================================
  # TSan (QA.7, A2-07) — the Linux build with -fsanitize=thread (EDEN_SANITIZE=thread; ASan and TSan
  # can't share a binary). Rule 8 (one load pthread, the MP network thread, probe and fetch workers) was
  # enforced only by prose. halt_on_error=1: the first unsuppressed race fails the gate.
  # port/tools/tsan-suppressions.txt holds only the mp mock: QA.14 (2026-11-12) moved the load thread's
  # Input/Player resets and a new world's first save to the main thread and emptied its engine lines.
  # Mac-measured 2026-11-12: these legs report the World::doneLoading race with a plain int, 0 with QA.7.
  # =============================================================================================
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld ninja-build cmake gdb zlib1g-dev libcurl4-openssl-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev

      # Ubuntu 24.04's 32 bits of mmap ASLR give older TSan runtimes "unexpected memory mapping".
      - name: Lower mmap ASLR for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-prefix
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-latest

      - name: Build SDL3 from source
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-prefix" \
            -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL/build --parallel
          cmake --install /tmp/SDL/build

      # QA.16 (A5-10): a compiler cache; the build is ~3 min of the job, and a sanitizer build is
      # a different set of objects, so each job has its own key.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}

      - name: Configure and build (TSan)
        working-directory: native
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja $EDEN_CMAKE_FLAGS -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DEDEN_SANITIZE=thread -DCMAKE_PREFIX_PATH="$HOME/sdl3-prefix"
          cmake --build build --parallel

      - name: Gates under TSan — load thread, streaming, browser, mods notice, network (the table, gates.sh)
        working-directory: native
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          set -e
          export LD_LIBRARY_PATH=$HOME/sdl3-prefix/lib
          export TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1 suppressions=$PWD/../port/tools/tsan-suppressions.txt"
          bash ../.github/scripts/gates.sh tsan

  # =============================================================================================
  # Windows — the point of the stage. MSYS2's CLANG64 environment IS an LLVM-mingw toolchain
  # (target x86_64-w64-windows-gnu), which was the plan's measured choice while the port compiled
  # ObjC off Apple: `cl.exe` has no Objective-C at all, and the MSVC ABI segfaulted clang on
  # `@finally` in ObjC++. Since G.3 there is no ObjC here; windows-msvc below tries the MSVC ABI. MSYS2 rather than the bare llvm-mingw tarball because zlib
  # is a hard requirement here (Classes/zpipe.c) and MSYS2 packages it.
  # =============================================================================================
  windows:
    runs-on: windows-latest
    needs: linux
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out with LF endings (fixtures are byte-compared to expect.txt / pinned hashes)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-gdb

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: C:\sdl3-prefix
          key: sdl3-${{ env.SDL_VERSION }}-windows-clang64

      - name: Build SDL3 from source
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/c/sdl3-prefix \
            -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL/build --parallel
          cmake --install /tmp/SDL/build

      - name: Configure
        working-directory: native
        run: cmake -B build -G Ninja $EDEN_CMAKE_FLAGS -DCMAKE_PREFIX_PATH=/c/sdl3-prefix

      - name: Build
        working-directory: native
        # `-- -k 0` — keep going after the first error and report EVERY one. Not a style choice:
        # this runner is the only place Windows ever compiles, ninja stops at the first failure by
        # default, and each round trip costs five minutes plus a push. One build that lists four
        # errors is four iterations saved. The step still fails, because cmake still returns
        # ninja's status.
        run: cmake --build build --parallel -- -k 0

      - name: Gates — the table (.github/scripts/gates.sh) — boot, geometry, selftests, leak probe
        working-directory: native
        env:
          GATE_JOBS: 3
        run: |
          set -e
          export PATH="/c/sdl3-prefix/bin:$PATH"
          bash ../.github/scripts/gates.sh windows

      # ROADMAP 5.9: the world browser's REAL HTTP backend (NSURLSession / libcurl / WinHTTP —
      # --browser-selftest above uses offline fixtures and never touches it). Lists from the archive
      # and both Eden servers, a preview, and the smallest archive world downloaded and loaded.
      # NOT A GATE: it depends on hagg3.github.io and edengame.net being up, which a red CI run
      # must never be about. Read its log when a backend changes.
      - name: Live network smoke — archive + both Eden servers (informational)
        working-directory: native
        continue-on-error: true
        run: ./build/eden_native --net-live-selftest --docs="$PWD/live-docs"

      - uses: actions/download-artifact@v4
        with:
          name: world-linux
          path: native/from-linux

      - name: Gate — read the world Linux wrote
        working-directory: native
        # CRITERION 4, AND UNTIL NOW IT WAS NOT CHECKED. Dropping the foreign save in and running
        # --stage1 with no --world created a NEW world called "stage1" beside it and checksummed
        # that; `grep -q checksum` then passed on a run that never opened Linux's file. Now it asks
        # for the world by its display name AND requires the geometry to equal what Linux got from
        # the same bytes — the one comparison that can only pass if the file really was read.
        run: |
          set -e
          . ../.github/scripts/run-gate.sh
          export PATH="/c/sdl3-prefix/bin:$PATH"
          rm -rf ci-docs && mkdir -p ci-docs
          cp from-linux/world-linux.emod ci-docs/
          run_gate "crossload" ./build/eden_native.exe --headless --stage1 --world=ci \
            --docs="$PWD/ci-docs"
          want=$(cat from-linux/world-linux.geom)
          got=$(sed -n 's/.*"geom":"\([0-9a-f]*\)".*/\1/p' gate-crossload.log | head -1)
          echo "linux wrote it as $want; windows read it as $got"
          [ -n "$got" ] && [ "$want" = "$got" ] || {
            echo "::error::windows read Linux's world as '$got', linux reads it as '$want'"; exit 1; }

      - name: Gate — save round-trip, and publish this platform's world
        working-directory: native
        run: |
          export PATH="/c/sdl3-prefix/bin:$PATH"
          mkdir -p own-docs
          ./build/eden_native.exe --headless --save-roundtrip --world=ci --docs="$PWD/own-docs"
          mkdir -p publish && cp "$(ls -S own-docs/Worlds/*/*.emod | head -1)" publish/world-windows.emod
          ./build/eden_native.exe --export=publish/world-windows.emod --export-out=publish/world-windows.eden
          ls -l publish

      - uses: actions/upload-artifact@v4
        with:
          name: world-windows
          retention-days: 1
          path: native/publish/world-windows.*
          if-no-files-found: error

      # -----------------------------------------------------------------------------------------
      # 3.7 — packaging. A PORTABLE ZIP, unsigned, and that is a recommendation the plan makes
      # explicitly rather than a corner cut: code signing is a paid certificate and a distribution
      # decision, MSIX is a store decision, and neither is on the path to "it plays". A zip you
      # unpack and double-click is also what the modding audience this build exists for wants.
      #
      # Layout is the one native/README.md documents and the one the ENGINE assumes: a flat
      # directory of assets beside the executable, because the shipped iOS app's bundle was flat
      # (Xcode's Copy-Bundle-Resources phase flattens media/) and Classes/World.cpp's LoadModels()
      # still fopen()s bare basenames against the bundle root.
      # -----------------------------------------------------------------------------------------
      - name: Package a portable zip
        working-directory: native
        run: |
          set -e
          rm -rf dist && mkdir dist
          cp build/eden_native.exe dist/eden.exe

          # THE ASSETS, AND `-type l` IS THE POINT. This used to say `-type f` on the strength of
          # "COPY_ON_ERROR already fell back to real copies, because symlinks need Developer Mode"
          # -- written before this job had ever run. It is not true on a GitHub Windows runner:
          # CMake's file(CREATE_LINK ... SYMBOLIC) succeeds there, so every asset beside the
          # executable is a LINK, `find -type f` matched none of them, and the zip shipped with
          # four files in it and no error. `cp -L` then copies what each one points at.
          find build -maxdepth 1 \( -type f -o -type l \) \
            \( -name '*.png' -o -name '*.edm' -o -name '*.caf' -o -name '*.wav' \
               -o -name '*.aif' -o -name '*.mp3' -o -name '*.eden' -o -name '*.emod' -o -name '*.ttf' \) -exec cp -L {} dist/ \;
          cp -RL build/packs dist/   # K.2-3: content packs keep their tree; no stock pack = no game

          # SDL3, plus the runtime this toolchain links against. `ldd` on the built exe is the
          # source of truth rather than a hand-listed set of DLL names: it reports what THIS binary
          # actually needs, so a toolchain change cannot silently ship an unrunnable zip.
          #
          # The filter is now "exists, and is not a Windows system DLL" rather than a whitelist of
          # /clang64|/mingw64|/sdl3-prefix directory names. That whitelist is what dropped SDL3.dll:
          # it lives outside the MSYS root (C:\sdl3-prefix), so ldd reports it in a spelling the
          # pattern did not match -- and the zip shipped without the one library the port is a
          # client of.
          ldd build/eden_native.exe | awk '{print $3}' | while read -r dll; do
            [ -f "$dll" ] || continue
            case "$dll" in
              /c/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]/*|[Cc]:[/\\][Ww][Ii][Nn][Dd][Oo][Ww][Ss][/\\]*) continue ;;
            esac
            cp -f "$dll" dist/
          done

          # ...and ASSERT the two things a silent miss above would leave behind. Both of these
          # failures shipped a zip that looked fine in the log and could not start.
          test -f dist/SDL3.dll || { echo "::error::SDL3.dll is not in the package"; exit 1; }
          cp ../LICENSE ../COPYING ../NOTICE dist/   # zstd (BSD-3) requires its notice in binary distributions
          test -f dist/NOTICE || { echo "::error::NOTICE is not in the package"; exit 1; }
          test -f dist/COPYING || { echo "::error::COPYING is not in the package"; exit 1; }
          test -f dist/Eden.emod || { echo "::error::Eden.emod is not in the package"; exit 1; }
          n=$(find dist -type f | wc -l)
          [ "$n" -gt 800 ] || { echo "::error::only $n files in the package; expected ~880"; exit 1; }
          ls -l dist | head -20
          echo "assets: $n files, $(du -sh dist | cut -f1)"

      - name: Smoke-test the packaged zip contents
        working-directory: native/dist
        # The package is worthless if it does not run from its own directory with nothing else on
        # PATH. This is the only check that covers the DLL collection above, and it is the closest
        # thing this workflow has to "a player unzipped it and double-clicked".
        #
        # `$PWD` is deliberately NOT on PATH: it is an MSYS path (/d/a/...) and the Windows loader
        # does not read those, so putting it there proved nothing. It does not need to be — Windows
        # searches the executable's own directory FIRST for its imports, which is exactly the
        # property a portable zip depends on. /usr/bin alone is the "nothing else available" part.
        run: PATH="/usr/bin" ./eden.exe --p1-gate

      - uses: actions/upload-artifact@v4
        with:
          name: eden-windows-x64-portable
          retention-days: 7
          path: native/dist
          if-no-files-found: error

  # =============================================================================================
  # Windows, MSVC ABI (G.3) — EXPERIMENTAL and non-blocking (continue-on-error). With no ObjC left
  # off Apple, the reasons the windows job above is MSYS2 CLANG64 are gone. This leg builds the same
  # tree with clang-cl (the MSVC ABI and the UCRT; plain cl.exe cannot read the engine's 400 C++
  # `#import`s) and vcpkg's static zlib/pthreads4w/dirent, then runs the core gates and prints the
  # numbers the user's Stage G condition asks for (WORKING/graphics-api-modernisation-report-
  # 2026-10-23.md §5 Q3): binary size within 5 % of the MSYS2 build, --stage1/--emod-selftest
  # identical, selftests green, --bench within noise, the ARM64 VM boot, no extra runtime DLLs.
  # The MSYS2 build stays the shipped one until every gate passes and the user approves a switch.
  # =============================================================================================
  windows-msvc:
    runs-on: windows-latest
    needs: linux
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - name: Check out with LF endings (fixtures are byte-compared to expect.txt / pinned hashes)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: vcpkg packages (static, /MT)
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install zlib pthreads dirent --triplet x64-windows-static

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: C:\sdl3-msvc
          key: sdl3-${{ env.SDL_VERSION }}-windows-clang-cl-mt

      - name: Build SDL3 from source (clang-cl, /MT)
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX='C:\sdl3-msvc' \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL/build --parallel
          cmake --install /tmp/SDL/build

      - name: Configure and build (-k 0 lists every error)
        working-directory: native
        run: |
          cmake -B build -G Ninja $EDEN_CMAKE_FLAGS -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_PREFIX_PATH='C:\sdl3-msvc'
          cmake --build build --parallel -- -k 0

      - name: Gates (the table, .github/scripts/gates.sh)
        working-directory: native
        run: |
          set -e
          export PATH="/c/sdl3-msvc/bin:$PATH"
          B=./build/eden_native.exe
          echo "binary size: $(stat -c %s $B) bytes (compare with the windows job's eden_native.exe)"
          echo "imports:"; dumpbin //dependents $B | grep -i '\.dll' || true
          bash ../.github/scripts/gates.sh msvc

  # =============================================================================================
  # macOS — NOT a new platform, and that is the job's purpose. It reproduces the checksums this
  # repository already records from the development machine, which is what proves the WORKFLOW
  # rather than only the two new legs. If macOS goes red here and green locally, the harness is
  # wrong; if both go red, the code is.
  # =============================================================================================
  macos:
    runs-on: macos-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: brew install sdl3

      - name: Configure and build
        working-directory: native
        run: |
          cmake -B build $EDEN_CMAKE_FLAGS
          cmake --build build --parallel

      - name: Gate — boot, checksums, selftests (the table, .github/scripts/gates.sh)
        working-directory: native
        env:
          GATE_JOBS: 3
        run: bash ../.github/scripts/gates.sh macos

      # ROADMAP 5.9: the world browser's REAL HTTP backend (NSURLSession / libcurl / WinHTTP —
      # --browser-selftest above uses offline fixtures and never touches it). Lists from the archive
      # and both Eden servers, a preview, and the smallest archive world downloaded and loaded.
      # NOT A GATE: it depends on hagg3.github.io and edengame.net being up, which a red CI run
      # must never be about. Read its log when a backend changes.
      - name: Live network smoke — archive + both Eden servers (informational)
        working-directory: native
        continue-on-error: true
        run: ./build/eden_native --net-live-selftest --docs="$PWD/live-docs"

      - uses: actions/download-artifact@v4
        with:
          name: world-linux
          path: native/from-linux

      - name: Gate — read the world Linux wrote
        working-directory: native
        # See the Windows job's copy of this note: without --world=ci this created a second world
        # and checksummed that, and without comparing the geom the gate could not tell.
        run: |
          set -e
          . ../.github/scripts/run-gate.sh
          rm -rf ci-docs && mkdir -p ci-docs
          cp from-linux/world-linux.emod ci-docs/
          run_gate "crossload" ./build/eden_native --headless --stage1 --world=ci \
            --docs="$PWD/ci-docs"
          want=$(cat from-linux/world-linux.geom)
          got=$(sed -n 's/.*"geom":"\([0-9a-f]*\)".*/\1/p' gate-crossload.log | head -1)
          echo "linux wrote it as $want; macos read it as $got"
          [ -n "$got" ] && [ "$want" = "$got" ] || {
            echo "::error::macos read Linux's world as '$got', linux reads it as '$want'"; exit 1; }


      - name: Gate — save round-trip, and publish this platform's world
        working-directory: native
        run: |
          mkdir -p own-docs
          ./build/eden_native --headless --save-roundtrip --world=ci --docs="$PWD/own-docs"
          mkdir -p publish && cp "$(ls -S own-docs/Worlds/*/*.emod | head -1)" publish/world-macos.emod
          ./build/eden_native --export=publish/world-macos.emod --export-out=publish/world-macos.eden

      - uses: actions/upload-artifact@v4
        with:
          name: world-macos
          retention-days: 1
          path: native/publish/world-macos.*
          if-no-files-found: error

      # -----------------------------------------------------------------------------------------
      # The downloadable: a tar.gz of a flat directory (binary + assets + a relocated libSDL3),
      # tarred here because an artifact zip drops unix mode bits. Homebrew's SDL3 is re-pointed at
      # @executable_path and both Mach-Os are ad-hoc signed (arm64 refuses unsigned, modified
      # code). It is NOT notarized: a browser download is quarantined, so the README note says to
      # run `xattr -dr com.apple.quarantine Emod` once.
      # -----------------------------------------------------------------------------------------
      - name: Package a portable tar.gz
        working-directory: native
        run: |
          set -e
          rm -rf dist && mkdir -p dist/Emod
          cp build/eden_native dist/Emod/emod
          find build -maxdepth 1 \( -type f -o -type l \) \
            \( -name '*.png' -o -name '*.edm' -o -name '*.caf' -o -name '*.wav' \
               -o -name '*.aif' -o -name '*.mp3' -o -name '*.eden' -o -name '*.emod' -o -name '*.ttf' \) -exec cp -L {} dist/Emod/ \;
          cp -RL build/packs dist/Emod/   # K.2-3: content packs keep their tree; no stock pack = no game
          lib=$(otool -L build/eden_native | awk '/libSDL3/{print $1}')
          cp -L "$lib" dist/Emod/libSDL3.0.dylib
          chmod u+w dist/Emod/libSDL3.0.dylib
          install_name_tool -id @executable_path/libSDL3.0.dylib dist/Emod/libSDL3.0.dylib
          install_name_tool -change "$lib" @executable_path/libSDL3.0.dylib dist/Emod/emod
          codesign --force -s - dist/Emod/libSDL3.0.dylib
          codesign --force -s - dist/Emod/emod
          if otool -L dist/Emod/emod dist/Emod/libSDL3.0.dylib | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::the package still links a Homebrew library"; exit 1; fi
          test -f dist/Emod/Eden.emod || { echo "::error::Eden.emod is not in the package"; exit 1; }
          n=$(find dist/Emod -type f | wc -l)
          [ "$n" -gt 800 ] || { echo "::error::only $n files in the package"; exit 1; }
          cp ../LICENSE ../COPYING ../NOTICE dist/Emod/   # zstd (BSD-3) requires its notice in binary distributions
          tar -C dist -czf Emod-macos-arm64.tar.gz Emod
          for f in COPYING LICENSE NOTICE; do tar -tzf Emod-macos-arm64.tar.gz | grep -qx "Emod/$f" || { echo "::error::$f is not inside Emod-macos-arm64.tar.gz"; exit 1; }; done
          ls -l Emod-macos-arm64.tar.gz

      - name: Smoke-test the package from another directory
        run: |
          set -e
          rm -rf /tmp/unpack && mkdir /tmp/unpack && tar -C /tmp/unpack -xzf native/Emod-macos-arm64.tar.gz
          (cd / && env -u DYLD_LIBRARY_PATH /tmp/unpack/Emod/emod --p1-gate)

      - uses: actions/upload-artifact@v4
        with:
          name: eden-macos-arm64-portable
          retention-days: 7
          path: native/Emod-macos-arm64.tar.gz
          if-no-files-found: error

  # =============================================================================================
  # iOS — THE PLATFORM PHASE N EXISTS FOR (Stage 4.1).
  #
  # The web build needed WebGL 2, i.e. Safari 15, i.e. iOS 15; the iOS floor is now 15.0 (SM.1).
  # Natively the devices from iOS 15 up (A8 and later) are in range, and this job is where that claim stops
  # being an argument. It does three things a laptop cannot do on its own — build the DEVICE slice
  # (this machine has Command Line Tools and no iOS SDK), build the SIMULATOR slice, and RUN the
  # simulator one — and it asserts values rather than exit codes, because `simctl launch` reports
  # its own status and not the app's.
  #
  # WHAT IT CANNOT CLAIM, and this is the same boundary the Linux and Windows jobs have: no
  # runner has a GPU-backed iOS device. Criterion 1 (a real iOS 15 device), criterion 3 (64z under
  # 300 MB on an iPad Air 2) and criterion 5 (touch play) are owed to a human with hardware. What
  # is machine-checked here is criterion 2 (geometry byte-identical to the other four targets),
  # criterion 4 (save-on-background, on the platform whose UIKit delivery rule is the reason
  # SDL_AddEventWatch is used at all) and save interchange with the world Linux wrote.
  # =============================================================================================
  ios:
    runs-on: macos-latest
    needs: linux
    # A SIMULATOR LAUNCH CAN HANG, and the default job timeout is six hours. `simctl launch`
    # waits for the app to exit, and an app that neither exits nor prints looks exactly like a
    # slow one — cap the whole job rather than guess per step. A green run was ~12 minutes (Oct);
    # by 2026-11-07 the two slice builds took 20-25 min each on the runner (~55-65 min total), so
    # 45 cancelled three runs mid-build. 90 keeps the hang cap without clipping a slow green run.
    timeout-minutes: 90
    env:
      # 15.0 is the iOS floor (SM.1), see native/CMakeLists.txt's iOS block. It is asserted below out of the built binary's own load command, because a
      # deployment target that silently got raised is exactly the kind of regression that only
      # shows up as "it will not install on my iPad".
      EDEN_IOS_MIN: "15.0"
      EDEN_BUNDLE_ID: "io.github.hagg3.emod"   # Emod, not Eden — port/src/eden_app_identity.h
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "iphoneos SDK        $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphonesimulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Cache SDL3 (both iOS slices)
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-ios
          key: sdl3-${{ env.SDL_VERSION }}-ios-1

      - name: Build SDL3 for iOS
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        # STATIC, and that is the one place this leg's SDL differs from the desktop legs'. A dylib
        # inside an .app has to be embedded, re-signed and declared, and each of those fails on a
        # device rather than in CI; a static SDL is one binary with nothing to embed. Both slices,
        # because a simulator build and a device build cannot share a library.
        run: |
          set -e
          git clone --depth 1 --branch "release-${SDL_VERSION}" https://github.com/libsdl-org/SDL.git /tmp/SDL
          for slice in iphoneos iphonesimulator; do
            cmake -S /tmp/SDL -B "/tmp/SDL/build-$slice" \
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$slice \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$EDEN_IOS_MIN" \
              -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
              -DSDL_TEST_LIBRARY=OFF \
              -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-ios/$slice"
            cmake --build "/tmp/SDL/build-$slice" --parallel
            cmake --install "/tmp/SDL/build-$slice"
          done

      - name: Build the device slice (arm64, unsigned)
        working-directory: native
        run: |
          set -e
          # SDL3_DIR RATHER THAN CMAKE_PREFIX_PATH, and it is not a preference: cross-compiling
          # for iOS puts CMake in root-path mode (CMAKE_FIND_ROOT_PATH = the SDK,
          # CMAKE_FIND_ROOT_PATH_MODE_PACKAGE = ONLY), so find_package IGNORES CMAKE_PREFIX_PATH
          # entirely and reports "could not find a package configuration file provided by SDL3"
          # while the file sits exactly where the prefix says. Naming the config directory is the
          # one form that is not subject to that mode.
          # -DEDEN_F3_HOOKS=ON: the device ipa is the test ipa (T.A8, T.B15's rebuild_max_ms);
          # the hooks are inert unless a harness flag drives them.
          cmake -B build-ios-device $EDEN_CMAKE_FLAGS -DEDEN_F3_HOOKS=ON \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$EDEN_IOS_MIN" \
            -DSDL3_DIR="$HOME/sdl3-ios/iphoneos/lib/cmake/SDL3"
          cmake --build build-ios-device --parallel

      - name: Gate — the device .app is what it claims to be
        working-directory: native
        # FOUR ASSERTIONS, and none of them is "the build succeeded". A bundle that compiles and
        # links can still be uninstallable: the wrong platform in the load command, a deployment
        # target something quietly raised, a missing Info.plist key, or the world file left
        # outside the .app because the asset step symlinked instead of copying (which is what it
        # does on every other platform — see the CMake comment). S.6: every target bundles
        # Eden.emod (11.8 MB, read in place) -- no Eden.eden.gz, no inflated cache; see
        # native/CMakeLists.txt and FileManagerHelper.cpp's fmh_init().
        run: |
          set -e
          APP=build-ios-device/Emod.app
          test -x "$APP/Emod"            || { echo "::error::no executable in the bundle"; exit 1; }
          test -f "$APP/Info.plist"      || { echo "::error::no Info.plist"; exit 1; }
          test -f "$APP/Eden.emod"       || { echo "::error::Eden.emod is not inside the .app"; exit 1; }
          test -f "$APP/packs/eden/pack.json" || { echo "::error::the stock pack (packs/eden/pack.json) is not inside the .app"; exit 1; }
          ! test -d "$APP/packs/emod_example" || { echo "::error::the example pack is bundled again (K.3-8: it is a catalogue download)"; exit 1; }
          ! test -f "$APP/Eden.eden"     || { echo "::error::raw Eden.eden shipped in the .app -- S.6 bundles only Eden.emod"; exit 1; }
          ! test -f "$APP/Eden.eden.gz"  || { echo "::error::Eden.eden.gz shipped in the .app -- S.6 retired it"; exit 1; }
          n=$(find "$APP" -type f | wc -l | tr -d ' ')
          [ "$n" -gt 800 ] || { echo "::error::only $n files in the .app; expected ~880"; exit 1; }
          # `-type l` deliberately: a symlink here would point at this runner's filesystem and be
          # dangling on any device. Zero is the only acceptable count.
          links=$(find "$APP" -type l | wc -l | tr -d ' ')
          [ "$links" = "0" ] || { echo "::error::$links symlink(s) inside the .app"; exit 1; }
          # CFBundleExecutable must name a file that exists, or the app installs and then fails to
          # launch with nothing useful in the log. Both come from EDEN_IOS_EXECUTABLE in CMake;
          # this is the assertion that they still agree.
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -x "$APP/$exe" || { echo "::error::CFBundleExecutable is '$exe' and there is no such executable"; exit 1; }
          vtool -show-build "$APP/$exe" | tee vtool-device.txt
          grep -Eqi 'platform +(2|ios)$' vtool-device.txt || {
            echo "::error::the device binary is not built for iOS"; cat vtool-device.txt; exit 1; }
          grep -Eq "minos +${EDEN_IOS_MIN}$" vtool-device.txt || {
            echo "::error::deployment target is not ${EDEN_IOS_MIN}"; cat vtool-device.txt; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$APP/Info.plist"
          echo "device .app: $n files, $(du -sh "$APP" | cut -f1)"

      - name: Package an unsigned .ipa
        working-directory: native
        # AN .ipa IS A ZIP WITH `Payload/<App>.app/` IN IT — that is the whole format, and it is
        # why this step is four lines rather than a signing pipeline.
        #
        # WHY CI MAKES IT AND NOT THE TESTER: a GitHub artifact zip does not dependably carry the
        # unix mode bits, and an app whose executable has lost +x will not launch. A zip we build
        # here stores its own modes, and GitHub wrapping that zip in another one is harmless.
        #
        # **IT IS UNSIGNED, DELIBERATELY.** Signing needs a certificate and a provisioning profile,
        # i.e. secrets and an Apple developer account, and the way this build actually reaches a
        # device is a tool that re-signs it with the tester's own Apple ID (Sideloadly, AltStore/
        # SideStore) or one that does not care (TrollStore). Those all take an unsigned .ipa.
        # See native/README.md for the install routes and their iOS-version limits.
        run: |
          set -e
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build-ios-device/Emod.app ipa/Payload/
          cp ../LICENSE ../COPYING ../NOTICE ipa/Payload/Emod.app/   # zstd (BSD-3) requires its notice in binary distributions
          (cd ipa && zip -qry ../Emod-unsigned.ipa Payload)
          # Assert the shape rather than trust the copy: a Payload/ with the executable in it, and
          # a plausible size. An .ipa that unzips to nothing is indistinguishable from a good one
          # until someone tries to install it.
          unzip -l Emod-unsigned.ipa | grep -q 'Payload/Emod.app/Emod' || {
            echo "::error::the .ipa has no Payload/Emod.app/Emod"; exit 1; }
          for f in COPYING LICENSE NOTICE; do unzip -l Emod-unsigned.ipa | grep -q "Payload/Emod.app/$f\$" || {
            echo "::error::$f is not inside the .ipa"; exit 1; }; done
          n=$(unzip -l Emod-unsigned.ipa | tail -1 | awk '{print $2}')
          [ "$n" -gt 800 ] || { echo "::error::only $n entries in the .ipa"; exit 1; }
          echo "Emod-unsigned.ipa: $n entries, $(du -h Emod-unsigned.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: Emod-ios-unsigned-ipa
          retention-days: 7
          path: native/Emod-unsigned.ipa
          if-no-files-found: error

      - name: Build the simulator slice
        working-directory: native
        run: |
          set -e
          cmake -B build-ios-sim $EDEN_CMAKE_FLAGS \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$EDEN_IOS_MIN" \
            -DSDL3_DIR="$HOME/sdl3-ios/iphonesimulator/lib/cmake/SDL3"
          cmake --build build-ios-sim --parallel

      - name: Boot a simulator and install
        id: sim
        run: |
          set -e
          UDID=$(python3 .github/scripts/pick-simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" native/build-ios-sim/Emod.app
          xcrun simctl get_app_container "$UDID" "$EDEN_BUNDLE_ID" data

      - name: Gates — boot and geometry, in the simulator
        # THREE THINGS HERE ARE NOT THE OBVIOUS SHAPE, and each of them is a first-run failure of
        # this job rather than caution:
        #
        # 1. **EDEN_LOG, not the console.** The first run booted the app fine — 874 bundle assets
        #    decoded, three [eden-p1] ticks, glErr=0 — and then hung for seven minutes, because
        #    returning from main() does not end an iOS process (SDL's UIKit delegate goes back to
        #    the run loop). That is fixed in the harness, but the lesson stands: an app's stdout
        #    reaches a pty only while something holds the other end, and on a real device there is
        #    no pty at all. The harness writes its own log into the app container; this reads it.
        # 2. **A hard alarm around every launch**, so a hang costs five minutes and still leaves a
        #    log rather than burning the job. macOS runners have no coreutils `timeout`;
        #    `perl -e alarm` is the portable equivalent.
        # 3. **64z only.** The 256z checksum is already claimed by four targets and it is the one
        #    that writes a gigabyte-scale world onto a runner's disk. Criterion 3 — the number this
        #    whole stage exists for — is a 64z figure anyway.
        #
        # EDEN_ARGS rather than trailing argv for reason (1) again: on a device the app is launched
        # by a tap and there is no argv. `simctl` forwards SIMCTL_CHILD_*.
        run: |
          set -e
          UDID=${{ steps.sim.outputs.udid }}
          DATA=$(xcrun simctl get_app_container "$UDID" "$EDEN_BUNDLE_ID" data)
          echo "container: $DATA"
          launch() {
            out="$1"; shift
            rm -f "$DATA/$out"
            SIMCTL_CHILD_EDEN_ARGS="$*" \
            SIMCTL_CHILD_EDEN_LOG="$DATA/$out" \
            SIMCTL_CHILD_SDL_VIDEO_DRIVER=dummy \
            SIMCTL_CHILD_SDL_AUDIO_DRIVER=dummy \
              perl -e 'alarm 300; exec @ARGV' \
              xcrun simctl launch --console-pty --terminate-running-process \
              "$UDID" "$EDEN_BUNDLE_ID" || echo "(launch returned $? — the log is the truth)"
            cp "$DATA/$out" "$out" 2>/dev/null || echo "::warning::no $out was written at all"
            tail -3 "$out" 2>/dev/null || true
          }

          launch p1.log --p1-gate
          ticks=$(grep -c 'eden-p1. tick' p1.log || true)
          [ "$ticks" -ge 3 ] || {
            echo "::error::the app produced $ticks engine ticks in the simulator"
            cat p1.log 2>/dev/null; exit 1; }

          launch stage1-64.log --headless --stage1 --shadows=off --world=ios64
          python3 .github/scripts/check-stage1.py stage1-64.log
          # H.2: the shadows `full` is integer shade + the light path's float maths; ARM64 iOS must
          # agree with the desktop legs (fp contraction is the first suspect if it does not).
          launch stage1-64s.log --headless --stage1 --shadows=classic --world=ios64s
          python3 .github/scripts/check-stage1.py --shadows stage1-64s.log
          # H.4: the Classic generator's fixture + pinned hashes on ARM64 iOS (the fixture is copied
          # into the container; the app reads it by host path, as it writes EDEN_LOG).
          cp port/tools/fixtures/classic/legacy-1315365413.bin.gz "$DATA/classic-fixture.bin.gz"
          # K.2-1: the content pin on ARM64 iOS (the tables and the oracle are the same bytes everywhere).
          launch content-dump.log --content-dump
          python3 .github/scripts/check-content-dump.py content-dump.log
          launch json.log --json-selftest
          grep -q 'json. .* ALL PASS' json.log || {
            echo "::error::--json-selftest did not pass in the simulator"; cat json.log; exit 1; }
          # K.2-3: the stock pack the app loaded from Emod.app/packs/eden/, and the corrupt fixtures (copied in).
          rm -rf "$DATA/pack-fixtures" && cp -R port/tools/fixtures/content/packs "$DATA/pack-fixtures"
          launch pack.log --pack-selftest="$DATA/pack-fixtures"
          grep -q 'pack. .* ALL PASS' pack.log || {
            echo "::error::--pack-selftest did not pass in the simulator"; cat pack.log; exit 1; }
          # K.2-4: mod packs, the example pack copied from Emod.app/packs/ into the app's Documents/Packs.
          rm -rf "$DATA/Documents/pack-fixtures" && mkdir -p "$DATA/Documents/pack-fixtures" && cp -R port/tools/fixtures/packs/emod_example "$DATA/Documents/pack-fixtures/"
          launch packs.log --packs-selftest
          grep -q 'eden-packs. ALL PASS' packs.log || {
            echo "::error::--packs-selftest did not pass in the simulator"; cat packs.log; exit 1; }
          # K.4: Lua mod scripts on iOS (the interpreter as C++, the sandbox, the budgets).
          launch lua.log --lua-selftest
          grep -q 'eden-lua. ALL PASS' lua.log || {
            echo "::error::--lua-selftest did not pass in the simulator"; cat lua.log; exit 1; }
          launch classic.log --classic-selftest --classic-fixture="$DATA/classic-fixture.bin.gz"
          grep -q 'eden-classic. ALL PASS' classic.log || {
            echo "::error::--classic-selftest did not pass in the simulator"; cat classic.log; exit 1; }
          # C.1: the console-line gates (corpus copied in like the classic fixture).
          cp port/tools/fixtures/cmds/corpus.txt "$DATA/cmds-corpus.txt"
          cp docs/console-reference.md "$DATA/console-reference.md"
          launch console.log --console-selftest --console-corpus="$DATA/cmds-corpus.txt" --console-reference="$DATA/console-reference.md"
          grep -q 'eden-console. ALL PASS' console.log || {
            echo "::error::--console-selftest did not pass in the simulator"; cat console.log; exit 1; }
          # MP.3a: the session world on ARM64 iOS (the replay and its .expect copied in, read by host path).
          cp port/tools/fixtures/mp/replay-1.lines "$DATA/mp-replay-1.lines"
          cp port/tools/fixtures/mp/replay-1.expect "$DATA/mp-replay-1.expect"
          launch mp-replay.log --mp-replay="$DATA/mp-replay-1.lines"
          grep -q 'eden-mp-replay. ALL PASS' mp-replay.log || {
            echo "::error::--mp-replay did not pass in the simulator"; cat mp-replay.log; exit 1; }

          # (the touch gate moved below — it needs a real window, so it cannot use `launch`,
          #  which sets the dummy video driver)

      - name: Gate — the ES 3.0 renderer actually draws (windowed, in the simulator)
        # THE ONLY PLACE THIS PORT'S SHADERS ARE COMPILED BY A GLES DRIVER. Everything else in
        # this job is headless, and headless means every GL call no-ops behind the shim's context
        # guard — a `#version 330 core` preamble handed to a GLES driver would pass every other
        # gate here and produce a black screen on a device.
        #
        # `--smoke` opens a real window, draws a world frame, then re-draws WITHOUT presenting and
        # reads the centre 64x64 back. Draw counts alone cannot tell "drew the world" from "drew
        # the world with a shader that failed to link", which is exactly what a dialect mistake
        # produces; the readback can. No dummy video driver here, for obvious reasons.
        #
        # WHAT THE FIRST GREEN RUN ACTUALLY REPORTED, so nobody reads more into this gate than it
        # carries: `OpenGL ES 3.0 APPLE-23.1.1` / **`Apple Software Renderer`**, world frame
        # draws=15 (macOS on an M2: 126), centre readback 4096/4096 non-black at **mean luma
        # 255.0** — i.e. a uniformly white centre, against 145.3 for the real scene on macOS. The
        # runner is a VM with no GPU and 90 frames of software rasterisation is not enough for the
        # world to stream in. So this proves THE PIPELINE RUNS — an ES 3.0 context is created, both
        # shader programs compile and link under the ES dialect, draws are issued, glErr is 0 and
        # pixels come back — and it does NOT prove the frame looks right. That is criterion 5 and
        # it is owed to a human with a device.
        #
        # If it ever fails for want of a context rather than for a real reason, say so here and
        # move the check to that device pass — do not weaken the assertion.
        run: |
          set -e
          UDID=${{ steps.sim.outputs.udid }}
          DATA=$(xcrun simctl get_app_container "$UDID" "$EDEN_BUNDLE_ID" data)
          rm -f "$DATA/smoke.log"
          SIMCTL_CHILD_EDEN_ARGS="--smoke --frames=90 --world=iossmoke" \
          SIMCTL_CHILD_EDEN_LOG="$DATA/smoke.log" \
            perl -e 'alarm 300; exec @ARGV' \
            xcrun simctl launch --console-pty --terminate-running-process \
            "$UDID" "$EDEN_BUNDLE_ID" || true
          cp "$DATA/smoke.log" smoke.log 2>/dev/null || true
          grep -E 'eden-smoke. (GL_VERSION|GL_RENDERER|world frame|centre)' smoke.log || true
          d=$(sed -n 's/.*world frame: draws=\([0-9]*\).*/\1/p' smoke.log | head -1)
          nb=$(sed -n 's/.*readback: \([0-9]*\)\/[0-9]* non-black.*/\1/p' smoke.log | head -1)
          [ -n "$d" ] && [ "$d" -gt 0 ] || {
            echo "::error::the world frame issued no draw calls under GLES"; cat smoke.log; exit 1; }
          [ -n "$nb" ] && [ "$nb" -gt 0 ] || {
            echo "::error::$d draw calls and the pixels are black — suspect the shader dialect"; exit 1; }
          echo "GLES draws=$d, non-black centre pixels=$nb"

      - name: Gate — touch through the letterbox (windowed, in the simulator)
        # THE REGRESSION TEST FOR THE FIRST DEVICE PASS'S BUG, and it has to be WINDOWED: headless
        # has no letterbox, so the mapping under test degenerates to the identity and the gate
        # proves nothing. On iOS the window is the device screen and the touch profile pins the
        # classic 16:9 layout, so on any non-16:9 device the box is letterboxed — which is the
        # configuration an iPad Air 2 reported as "switches don't respond to touch at all".
        #
        # The test taps the engine's OWN reported `rmenu` rect, inverted through the letterbox the
        # renderer is actually using. If the translator and the fit ever disagree, the tap lands on
        # a bar and this fails.
        #
        # 600 s, not the 300 every other launch here gets (CI.1, 2026-10-04): this is the one
        # windowed gate that runs hundreds of ticks under the runner's SOFTWARE rasteriser at the
        # simulator's full 2736x1260. It took 264 s before N.4.7 added the fly-off walk check and
        # 331 s after it; every failure since was the alarm killing that last check mid-run, with
        # every check before it PASS. Locally 3.6 s, on the iPad Air 2 29 s.
        run: |
          set -e
          UDID=${{ steps.sim.outputs.udid }}
          DATA=$(xcrun simctl get_app_container "$UDID" "$EDEN_BUNDLE_ID" data)
          rm -f "$DATA/touch.log"
          SIMCTL_CHILD_EDEN_ARGS="--touch-selftest --world=iostouch" \
          SIMCTL_CHILD_EDEN_LOG="$DATA/touch.log" \
            perl -e 'alarm 600; exec @ARGV' \
            xcrun simctl launch --console-pty --terminate-running-process \
            "$UDID" "$EDEN_BUNDLE_ID" || true
          cp "$DATA/touch.log" touch.log 2>/dev/null || true
          grep -E 'eden-display|eden-gl. letterbox|eden-touch' touch.log || true
          grep -q 'eden-touch. ALL PASS' touch.log || {
            echo "::error::--touch-selftest did not pass in the simulator"; cat touch.log; exit 1; }

      - name: Gate — save-on-background, on the platform it was written for
        # Stage 4.2 wired SDL_EVENT_WILL_ENTER_BACKGROUND through SDL_AddEventWatch() because
        # <SDL_events.h> REQUIRES it there: iOS delivers that event synchronously from inside
        # UIKit's applicationDidEnterBackground: and the main loop may never reach SDL_PollEvent
        # again. Every other platform runs that code path as a formality. This is the one that
        # exercises it with a real UIApplication in the process.
        run: |
          set -e
          UDID=${{ steps.sim.outputs.udid }}
          DATA=$(xcrun simctl get_app_container "$UDID" "$EDEN_BUNDLE_ID" data)
          rm -f "$DATA/background.log"
          SIMCTL_CHILD_EDEN_ARGS="--background-selftest --world=iosbg" \
          SIMCTL_CHILD_EDEN_LOG="$DATA/background.log" \
          SIMCTL_CHILD_SDL_VIDEO_DRIVER=dummy SIMCTL_CHILD_SDL_AUDIO_DRIVER=dummy \
            perl -e 'alarm 300; exec @ARGV' \
            xcrun simctl launch --console-pty --terminate-running-process \
            "$UDID" "$EDEN_BUNDLE_ID" || true
          cp "$DATA/background.log" background.log 2>/dev/null || true
          grep -q 'eden-background. ALL PASS' background.log || {
            echo "::error::--background-selftest did not pass in the simulator"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: world-linux
          path: native/from-linux

      - name: Gate — read the world Linux wrote
        # The fifth target on the same bytes. See the Windows job's copy of this note for why the
        # comparison is against Linux's OWN checksum for the file rather than a grep for the word.
        run: |
          set -e
          UDID=${{ steps.sim.outputs.udid }}
          DATA=$(xcrun simctl get_app_container "$UDID" "$EDEN_BUNDLE_ID" data)
          mkdir -p "$DATA/Documents"
          cp native/from-linux/world-linux.emod "$DATA/Documents/"
          SIMCTL_CHILD_EDEN_ARGS="--headless --stage1 --world=ci" \
          SIMCTL_CHILD_EDEN_LOG="$DATA/crossload.log" \
          SIMCTL_CHILD_SDL_VIDEO_DRIVER=dummy SIMCTL_CHILD_SDL_AUDIO_DRIVER=dummy \
            perl -e 'alarm 300; exec @ARGV' \
            xcrun simctl launch --console-pty --terminate-running-process \
            "$UDID" "$EDEN_BUNDLE_ID" || true
          cp "$DATA/crossload.log" crossload.log 2>/dev/null || true
          want=$(cat native/from-linux/world-linux.geom)
          got=$(sed -n 's/.*"geom":"\([0-9a-f]*\)".*/\1/p' crossload.log | head -1)
          echo "linux wrote it as $want; ios read it as $got"
          [ -n "$got" ] && [ "$want" = "$got" ] || {
            echo "::error::ios read Linux's world as '$got', linux reads it as '$want'"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: eden-ios-device-app
          retention-days: 7
          path: native/build-ios-device/Emod.app
          if-no-files-found: error

  # =============================================================================================
  # Byte comparison, on top of the three cross-loads above. Kept separate and non-fatal-by-design
  # in exactly one respect: a DIFFERENCE here is reported loudly but the loads are what the
  # criterion is about. If the bytes do differ, the diff's offset is the thing worth knowing, so
  # print it rather than only failing.
  # =============================================================================================
  interchange:
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    steps:
      # This job used to download only the three artifacts, because a `cmp` needs nothing else.
      # It now runs a script from the repo.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: world-linux,   path: w/linux }
      - uses: actions/download-artifact@v4
        with: { name: world-windows, path: w/windows }
      - uses: actions/download-artifact@v4
        with: { name: world-macos,   path: w/macos }
      - name: Compare the three worlds
        # See .github/scripts/compare-worlds.py for what this can and cannot claim. Short version:
        # each job creates its OWN world, so the header's random-spawn fields and a small part of
        # the simulated column data are legitimately not reproducible — measured at 142 of 44,976
        # bytes between two runs of the SAME binary on ONE machine. What it asserts is what is
        # invariant and what actually decides whether a file loads: size, level_seed,
        # directory_offset, version, and the ColumnIndex directory byte for byte.
        #
        # The interchange CLAIM is not made here. It is made by the three "read the world Linux
        # wrote" gates, which now require each platform to reproduce Linux's own geometry checksum
        # from Linux's bytes.
        run: |
          ls -l w/*/*.eden
          sha256sum w/*/*.eden
          python3 .github/scripts/compare-worlds.py \
            w/linux/world-linux.eden w/windows/world-windows.eden w/macos/world-macos.eden

  # =============================================================================================
  # release — only for a workflow_dispatch with release=true (./publish-to-edencom.sh --release).
  # Creates (or updates) the public release v<version> and attaches the selected platforms'
  # artifacts. Linux and macOS ship no packaged artifact yet, so they are not offered.
  # =============================================================================================
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [linux, sanitize, tsan, windows, macos, ios, interchange]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.release_platforms }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -e
          VERSION="${INPUT_VERSION:-$(tr -d '[:space:]' < VERSION.txt)}"
          TAG="v$VERSION"
          mkdir -p out
          for p in ${PLATFORMS//,/ }; do
            case "$p" in
              linux)   cp artifacts/eden-linux-x64-portable/Emod-linux-x64.tar.gz "out/Emod-$VERSION-linux-x64.tar.gz" ;;
              macos)   cp artifacts/eden-macos-arm64-portable/Emod-macos-arm64.tar.gz "out/Emod-$VERSION-macos-arm64.tar.gz" ;;
              windows) (cd artifacts/eden-windows-x64-portable && zip -qr "../../out/Emod-$VERSION-windows-x64-portable.zip" .) ;;
              ios)     cp artifacts/Emod-ios-unsigned-ipa/Emod-unsigned.ipa "out/Emod-$VERSION-ios-unsigned.ipa" ;;
              *) echo "::error::unknown platform $p"; exit 1 ;;
            esac
          done
          ls -l out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Emod $VERSION" \
              --notes "Emod $VERSION. macOS: run xattr -dr com.apple.quarantine Emod once after unpacking (not notarized). Linux: needs the usual system GL, X11 or Wayland, curl and audio libraries. iOS: the .ipa is unsigned; install with TrollStore, Sideloadly or AltStore."
          fi
